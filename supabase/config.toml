
[functions.sugerencia-ia]
enabled = true
# Explícito a propósito: el gateway ya rechaza requests sin token (verificado
# con un POST sin Authorization, devuelve 401), pero la función no valida nada
# por su cuenta. Si esto vuelve a false, la función queda abierta a cualquiera.
verify_jwt = true
import_map = "./functions/sugerencia-ia/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/sugerencia-ia/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/sugerencia-ia/*.html" ]

[functions.eliminar-cuenta]
enabled = true
# Obligatorio acá: la identidad del que borra sale del JWT y de ningún otro
# lado. Con verify_jwt = false, la función aceptaría requests sin token y el
# getUser() de adentro fallaría, pero es la única barrera — no la aflojes.
verify_jwt = true
import_map = "./functions/eliminar-cuenta/deno.json"
entrypoint = "./functions/eliminar-cuenta/index.ts"
